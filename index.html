<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>내전 MMR 밸런서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 열 콘솔. 상단 탭, 팀 짜기는 블루/레드 두 카드가 마주보는 구도 */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --ink: #141823;
  --muted: #5b6273;
  --line: #d9dde6;
  --blue: #2259c4;
  --blue-soft: #e3ebfb;
  --red: #c2343a;
  --red-soft: #fae5e5;
  --gold: #94690f;
  --gold-soft: #f6ecd4;
  --good: #1d7f4e;
  --bad: #c2343a;
  --on-ink: #ffffff;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Chakra Petch", "Noto Sans KR", ui-monospace, system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017; --surface: #161a24; --surface-2: #1c212d; --ink: #e7e9ef; --muted: #959cad; --line: #2a3141;
    --blue: #6c9cf2; --blue-soft: #1a2741; --red: #f07474; --red-soft: #3a1d22; --gold: #d9ae55; --gold-soft: #2f2716;
    --good: #4cc488; --bad: #f07474; --on-ink: #0d1017; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1017; --surface: #161a24; --surface-2: #1c212d; --ink: #e7e9ef; --muted: #959cad; --line: #2a3141;
  --blue: #6c9cf2; --blue-soft: #1a2741; --red: #f07474; --red-soft: #3a1d22; --gold: #d9ae55; --gold-soft: #2f2716;
  --good: #4cc488; --bad: #f07474; --on-ink: #0d1017; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; text-wrap: balance; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .num { font-size: 12px; letter-spacing: 0.14em; color: var(--gold); font-weight: 700; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; }
.pill.shared { color: var(--good); border-color: currentColor; }
.pill.off { color: var(--bad); border-color: currentColor; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; }
.tabs a { text-align: center; padding: 8px 4px; border-radius: 7px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.tabs a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
section[data-view] { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.label { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; text-transform: uppercase; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; font-weight: 500; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
button.blue { background: var(--blue); color: var(--surface); border-color: var(--blue); }
button.red { background: var(--red); color: var(--surface); border-color: var(--red); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.small { padding: 5px 10px; font-size: 13px; }
button.link { border: 0; background: none; padding: 0; color: var(--blue); text-decoration: underline; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 84px; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }
.field span { font-size: 12px; color: var(--muted); }
.panel > .field { flex: none; }

/* 참가자 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.chip .num { font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip[aria-pressed="true"] .num { color: var(--on-ink); opacity: 0.7; }
.chip.marked { outline: 3px solid var(--gold); outline-offset: 1px; }
.cons { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.cons-list { display: flex; flex-wrap: wrap; gap: 6px; }
.cons-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.cons-item b { font-size: 11px; color: var(--gold); }
.cons-item.diff b { color: var(--red); }
.cons-item button { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 15px; line-height: 1; }
.cons-pick { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); }
.count { font-size: 13px; color: var(--muted); }
.count b { color: var(--ink); }

/* 승률 막대 */
.odds { display: flex; flex-direction: column; gap: 6px; }
.odds-labels { display: flex; justify-content: space-between; font-family: var(--font-num); font-weight: 700; font-size: 14px; }
.odds-labels .b { color: var(--blue); } .odds-labels .r { color: var(--red); }
.bar { height: 10px; border-radius: 999px; background: var(--red); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .35s ease; }
.series { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.series .score { font-size: 26px; font-weight: 700; letter-spacing: 0.04em; }
.series .b { color: var(--blue); } .series .r { color: var(--red); }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 1px solid var(--line); }
.team.blue { background: var(--blue-soft); border-color: var(--blue); }
.team.red { background: var(--red-soft); border-color: var(--red); }
.team-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.team-head .side { font-family: var(--font-num); font-weight: 700; letter-spacing: 0.12em; font-size: 14px; }
.team.blue .side { color: var(--blue); } .team.red .side { color: var(--red); }
.team-head .avg { font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.team ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.team li { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; font-size: 14px; }
.team li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.team li .num { font-size: 13px; color: var(--muted); white-space: nowrap; }
.swing { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.team li.swappable { cursor: pointer; border-radius: 6px; margin: 0 -6px; padding: 2px 6px; }
.team li.swappable:hover { background: var(--surface); }
.team li.swap-on { background: var(--gold-soft); outline: 2px solid var(--gold); }

/* 순위 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.rank { font-family: var(--font-num); font-weight: 700; color: var(--muted); width: 2.5em; }
tr.top1 td.rank { color: var(--gold); }
td.mmr { font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); margin-left: 6px; font-weight: 700; vertical-align: 1px; }

/* 기록 */
.match { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.match-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.win-b { color: var(--blue); font-weight: 700; } .win-r { color: var(--red); font-weight: 700; }
.match .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .cols ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; min-width: 0; }
.match .cols li { display: flex; justify-content: space-between; gap: 6px; }
.match .cols li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.match .cols .label.b { color: var(--blue); } .match .cols .label.r { color: var(--red); }
.up { color: var(--good); } .down { color: var(--bad); }
.kda { font-size: 11px; color: var(--muted); font-family: var(--font-num); white-space: nowrap; }
.shot { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.shot-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.shot-who { min-width: 0; overflow-wrap: anywhere; }
.shot-who .b { color: var(--blue); }
.shot select { padding: 5px 8px; font-size: 13px; max-width: 45%; }
.trash { border-top: 1px dashed var(--line); padding-top: 10px; }
.trash summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.trash[open] { display: flex; flex-direction: column; gap: 8px; }
.trash-item { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); border: 1px solid var(--bad); font-size: 14px; }

/* 선수 */
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.plist li:last-child { border-bottom: 0; }
.plist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.plist .num { color: var(--muted); font-size: 13px; white-space: nowrap; }
.edit { border: 1px solid var(--gold); background: var(--gold-soft); }
.pos-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pos-pick button { padding: 6px 12px; font-size: 14px; border-radius: 999px; background: var(--surface-2); }
.pos-pick button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.pos-pick button[data-rank="1"]::after { content: " 주"; font-size: 11px; opacity: .75; }
.pos-pick button[data-rank="2"]::after { content: " 부"; font-size: 11px; opacity: .75; }
.role { display: inline-block; min-width: 2.6em; font-size: 12px; color: var(--muted); font-weight: 700; }
.role.off { color: var(--gold); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 20; }
@media (max-width: 380px) {
  .match .cols { grid-template-columns: 1fr; }
  .tabs a { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ---------- 순수 로직
const TIERS = [['아이언', 700], ['브론즈', 850], ['실버', 1000], ['골드', 1150], ['플래티넘', 1300], ['에메랄드', 1450], ['다이아 이상', 1600]];
const PLACEMENT_GAMES = 10;
const POSITIONS = [['top', '탑'], ['jungle', '정글'], ['mid', '미드'], ['adc', '원딜'], ['support', '서폿']];
const POS_KEYS = POSITIONS.map(p => p[0]);
const POS_LABEL = Object.fromEntries(POSITIONS);
const POS_SLACK = 30; // 포지션을 맞추려고 허용하는 평균 MMR 차이 여유
const SERIES_WINS = 2; // 3판 2선

function expected(ra, rb) { return 1 / (1 + Math.pow(10, (rb - ra) / 400)); }
function kFactor(games) { return games < PLACEMENT_GAMES ? 48 : 32; }
// 연승은 양수, 연패는 음수
function nextStreak(prev, won) { prev = prev || 0; return won ? (prev > 0 ? prev + 1 : 1) : (prev < 0 ? prev - 1 : -1); }
function teamAvg(ids, map) { return ids.reduce((s, id) => s + map[id].mmr, 0) / ids.length; }

// players: [{id, mmr}] 정렬된 순서. 0번은 항상 A팀
function splitAll(players) {
  const n = players.length, half = n / 2, out = [];
  const total = players.reduce((s, p) => s + p.mmr, 0);
  const pick = (start, chosen, sum) => {
    if (chosen.length === half) {
      const a = chosen.map(i => players[i].id);
      const set = new Set(chosen);
      const b = players.filter((_, i) => !set.has(i)).map(p => p.id);
      const diff = Math.abs(sum / half - (total - sum) / half);
      out.push({ a, b, diff, key: a.join('|') });
      return;
    }
    for (let i = start; i <= n - (half - chosen.length); i++) {
      chosen.push(i); pick(i + 1, chosen, sum + players[i].mmr); chosen.pop();
    }
  };
  pick(1, [0], players[0].mmr);
  return out.sort((x, y) => x.diff - y.diff);
}

// 한 팀 안에서 서로 다른 포지션 배정. 선호 밖 배정 수(off) 최소. 선호 없음 = 어디든 괜찮음
function assignRoles(ids, prefs) {
  let best = null;
  const roles = {};
  const go = (i, used, off) => {
    if (best && off >= best.off) return;
    if (i === ids.length) { best = { off, roles: { ...roles } }; return; }
    const id = ids[i], pref = prefs[id] || [];
    const order = pref.length ? [...pref, ...POS_KEYS.filter(p => !pref.includes(p))] : POS_KEYS;
    for (const p of order) {
      if (used.has(p)) continue;
      used.add(p); roles[id] = p;
      go(i + 1, used, off + (pref.length && !pref.includes(p) ? 1 : 0));
      used.delete(p);
    }
  };
  go(0, new Set(), 0);
  return best;
}

// players: [{id, mmr, pos}]. 평균 차이 최소 + POS_SLACK 안에서 비선호 배정이 가장 적은 조합을 고른다
// cons: { same: [[id...]], diff: [[id, id]] }. 같은 팀 묶음은 참가한 사람끼리만, 다른 팀 쌍은 둘 다 참가할 때만 적용
function fitsCons(s, cons, inSel) {
  const A = new Set(s.a);
  return (cons.same || []).every(g => { const m = g.filter(inSel); return m.every(id => A.has(id)) || m.every(id => !A.has(id)); })
    && (cons.diff || []).every(([x, y]) => !inSel(x) || !inSel(y) || A.has(x) !== A.has(y));

// 조건을 만족하는 조합이 없으면 null
function pickSplit(players, lastKey, rnd = Math.random, cons = {}) {
  const sorted = [...players].sort((x, y) => (x.id < y.id ? -1 : 1));
  const prefs = Object.fromEntries(players.map(p => [p.id, p.pos || []]));
  const sel = new Set(players.map(p => p.id)), inSel = id => sel.has(id);
  const all = splitAll(sorted).filter(s => fitsCons(s, cons, inSel));
  if (!all.length) return null;
  const near = all.filter(s => s.diff <= all[0].diff + POS_SLACK);
  for (const s of near) {
    const ra = assignRoles(s.a, prefs), rb = assignRoles(s.b, prefs);
    s.off = ra.off + rb.off; s.roles = { ...ra.roles, ...rb.roles };
  }
  const bestOff = Math.min(...near.map(s => s.off));
  const fit = near.filter(s => s.off === bestOff);
  let pool = fit.filter(s => s.diff <= fit[0].diff + 10).slice(0, 12);
  if (pool.length > 1) pool = pool.filter(s => s.key !== lastKey);
  const s = pool[Math.floor(rnd() * pool.length)];
  const aBlue = rnd() < 0.5;
  return { blue: aBlue ? s.a : s.b, red: aBlue ? s.b : s.a, diff: s.diff, key: s.key, roles: s.roles, off: s.off };
}

// 연승/연패 가속: 시리즈 기준 n연속(2 이상) 중에 같은 결과가 나오면 ×(1 + 0.1n). 상한 없음
function streakMult(streak, won) {
  const n = Math.abs(streak || 0);
  if (n < 2 || (streak > 0) !== won) return 1;
  return Math.round((1 + 0.1 * n) * 10) / 10;
}
function computeDeltas(blue, red, winner, map) {
  const rb = teamAvg(blue, map), rr = teamAvg(red, map);
  const eBlue = expected(rb, rr);
  const deltas = {};
  const one = (id, won, e) => Math.round(kFactor(map[id].games) * streakMult(map[id].streak, won) * ((won ? 1 : 0) - e));
  for (const id of blue) deltas[id] = one(id, winner === 'blue', eBlue);
  for (const id of red) deltas[id] = one(id, winner === 'red', 1 - eBlue);
  return { deltas, pBlue: Math.round(eBlue * 100) };
}

function parseNames(text) {
  const seen = new Set(), out = [];
  for (const raw of text.split(/[\n,]/)) {
    const n = raw.trim().slice(0, 20);
    if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); }
  }
  return out;
}

    <div class="odds">
      <div class="odds-labels"><span class="b">블루 ${pB}%</span><span class="muted">평균 차이 ${Math.abs(rb - rr).toFixed(1)}${offCount ? ` · 비선호 ${offCount}명` : ''}</span><span class="r">${100 - pB}% 레드</span></div>
      <div class="bar" role="img" aria-label="블루 예상 승률 ${pB}%"><i style="width:${pB}%"></i></div>
    </div>
    <div class="teams">${card('blue', s.blue, rb, eB)}${card('red', s.red, rr, 1 - eB)}</div>
    ${s.done ? `<div class="actions two">
      <button class="primary" id="btnAgain" ${dis}>같은 팀으로 한 번 더</button>
      <button id="btnClose" ${dis}>결과 닫기</button>

    <span class="muted">새로 짜려면 위에서 참가자를 고르고 팀 짜기를 누르세요.</span>` : `<div class="actions">
      ${played ? `<button id="btnEndSeries" ${dis}>시리즈 종료</button>` : `<button id="btnReroll" ${dis}>다시 짜기</button>`}

function seriesRate(p) {
  const n = (p.sWins || 0) + (p.sLosses || 0);

function streakText(n) {

function fmtTime(ts) {

}
const kda = st => [st.kills, st.deaths, st.assists].map(v => (v == null ? '?' : v)).join('/');

// ---------- 동작
function route() {
  const tabs = ['teams', 'ranking', 'history', 'players'];
  const cur = tabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'teams';
  document.querySelectorAll('[data-view]').forEach(s => { s.hidden = s.dataset.view !== cur; });
  document.querySelectorAll('[data-tab]').forEach(a => { if (a.dataset.tab === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
window.addEventListener('hashchange', route);

function makeSplit() {
  const map = pmap();
  const players = [...state.selected].map(id => ({ id, mmr: map[id].mmr, pos: map[id].pos || [] }));
  const p = pickSplit(players, repo.series ? repo.series.key : state.lastKey, Math.random, state.cons);
  if (!p) { toast('같은 팀/다른 팀 조건을 모두 만족하는 조합이 없습니다. 조건을 확인하세요.'); return; }
  state.lastKey = p.key;
  if (inSeries()) { toast('다른 사람이 이미 시리즈를 시작했습니다.'); return; }
  run(() => repo.setSeries({ blue: p.blue, red: p.red, roles: p.roles, key: p.key, sid: newId(), score: { blue: 0, red: 0 } }));
}
function rolesFor(blue, red, map) {
  const prefs = Object.fromEntries([...blue, ...red].map(id => [id, map[id].pos || []]));
  return { ...assignRoles(blue, prefs).roles, ...assignRoles(red, prefs).roles };
}
// 직접 짜기: MMR 순으로 번갈아 나눠 시작하고, 선수를 맞바꿔 조정한다
function manualSplit() {
  if (inSeries()) { toast('다른 사람이 이미 시리즈를 시작했습니다.'); return; }
  const map = pmap(), ids = [...state.selected].sort((a, b) => map[b].mmr - map[a].mmr);
  const blue = ids.filter((_, i) => i % 4 === 0 || i % 4 === 3), red = ids.filter((_, i) => i % 4 === 1 || i % 4 === 2);
  state.swapId = null;
  run(() => repo.setSeries({ blue, red, roles: rolesFor(blue, red, map), key: '', sid: newId(), score: { blue: 0, red: 0 } }));
}
function swapPick(id) {
  const s = repo.series; if (!s) return;
  const a = state.swapId;
  if (!a || a === id || s.blue.includes(a) === s.blue.includes(id)) { state.swapId = a === id ? null : id; renderTeams(); return; }
  const sw = x => (x === a ? id : x === id ? a : x);
  const blue = s.blue.map(sw), red = s.red.map(sw);
  state.swapId = null;
  run(() => repo.setSeries({ ...s, blue, red, roles: rolesFor(blue, red, pmap()), key: '' }));
}
const inSeries = () => repo.series && !repo.series.done && repo.series.score.blue + repo.series.score.red > 0;

// 같은 팀 / 다른 팀 조건 (이 기기에 저장, 팀을 짤 때만 쓰임)
const CONS_MAX = { same: 5, diff: 2 };
function saveCons() { lsSet('mmr-cons', JSON.stringify(state.cons)); }
function renderCons(map) {
  const el = $('cons');
  const name = id => (map[id] ? esc(map[id].name) : null);
  // 삭제된 선수는 조건에서 뺀다
  const clean = g => g.filter(id => map[id]);
  if (repo.players.length) {
    state.cons.same = state.cons.same.map(clean).filter(g => g.length >= 2);
    state.cons.diff = state.cons.diff.map(clean).filter(g => g.length === 2);
  }
  if (state.picking) {
    const label = state.picking === 'same' ? '같은 팀으로 묶을 사람' : '서로 다른 팀으로 나눌 두 사람';
    el.innerHTML = `<div class="cons-pick">위 이름을 눌러 <b>${label}</b>을 고르세요 · ${state.pick.size}/${CONS_MAX[state.picking]}명</div>
      <div class="row"><button class="small primary" id="btnConsDone" ${state.pick.size >= 2 ? '' : 'disabled'}>완료</button><button class="small" id="btnConsCancel">취소</button></div>`;
    return;
  }
  const items = [
    ...state.cons.same.map((g, i) => `<span class="cons-item"><b>같은 팀</b>${g.map(name).join(' + ')}<button data-del="same:${i}" aria-label="조건 삭제">×</button></span>`),
    ...state.cons.diff.map((g, i) => `<span class="cons-item diff"><b>다른 팀</b>${g.map(name).join(' ↔ ')}<button data-del="diff:${i}" aria-label="조건 삭제">×</button></span>`)
  ];
  el.innerHTML = `${items.length ? `<div class="cons-list">${items.join('')}</div>` : ''}
    <div class="row"><button class="small" id="btnConsSame">+ 같은 팀 묶기</button><button class="small" id="btnConsDiff">+ 다른 팀 나누기</button></div>`;
}
$('cons').addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'btnConsSame' || t.id === 'btnConsDiff') { state.picking = t.id === 'btnConsSame' ? 'same' : 'diff'; state.pick = new Set(); }
  else if (t.id === 'btnConsCancel') { state.picking = null; state.pick = new Set(); }
  else if (t.id === 'btnConsDone') {
    const g = [...state.pick];
    // 한 사람이 여러 같은 팀 묶음에 있으면 묶음을 합친다
    if (state.picking === 'same') {
      const touching = state.cons.same.filter(x => x.some(id => state.pick.has(id)));
      const merged = [...new Set([...g, ...touching.flat()])];
      if (merged.length > 5) { toast('같은 팀 묶음은 5명까지입니다.'); return; }
      state.cons.same = [...state.cons.same.filter(x => !touching.includes(x)), merged];
    } else state.cons.diff.push(g);
    state.picking = null; state.pick = new Set(); saveCons();
  } else if (t.dataset.del) {
    const [k, i] = t.dataset.del.split(':'); state.cons[k].splice(+i, 1); saveCons();
  } else return;
  renderTeams();
});

$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  if (state.picking) {
    const id = b.dataset.pick;
    if (state.pick.has(id)) state.pick.delete(id);
    else if (state.pick.size >= CONS_MAX[state.picking]) { toast(`최대 ${CONS_MAX[state.picking]}명입니다.`); return; }
    else state.pick.add(id);
    renderTeams(); return;
  }
  if (inSeries()) { toast('시리즈 중에는 참가자를 바꿀 수 없습니다. 시리즈 종료 후 바꾸세요.'); return; }
  const id = b.dataset.pick;
  if (state.selected.has(id)) state.selected.delete(id);
  else if (state.selected.size >= 10) { toast('한 판은 최대 10명입니다.'); return; }
  else state.selected.add(id);
  saveSel(); renderTeams();
});
$('btnClearSel').addEventListener('click', () => {
  if (inSeries()) { toast('시리즈 중에는 참가자를 바꿀 수 없습니다. 시리즈 종료 후 바꾸세요.'); return; }
  state.selected.clear(); saveSel(); renderTeams(); });
$('btnSplit').addEventListener('click', makeSplit);
$('btnManual').addEventListener('click', manualSplit);

$('result').addEventListener('click', async e => {
  if (e.target.id === 'btnReroll') return makeSplit();
  const sw = e.target.closest('[data-swap]'); if (sw) return swapPick(sw.dataset.swap);
  if (e.target.id === 'btnClose') { run(() => repo.setSeries(null)); return; }
  if (e.target.id === 'btnAgain') {
    const s = repo.series;
    run(() => repo.setSeries({ blue: s.blue, red: s.red, roles: s.roles, key: s.key, sid: newId(), score: { blue: 0, red: 0 } }));
    return;
  }
  if (e.target.id === 'btnEndSeries') { if (await run(() => repo.setSeries(null))) toast('시리즈를 종료했습니다.'); return; }
  const w = e.target.closest('[data-win]'); if (!w) return;
  const winner = w.dataset.win, s = repo.series, map = pmap();
  if (!s) return;
  const ids = [...s.blue, ...s.red];
  if (ids.some(id => !map[id])) { toast('삭제된 선수가 있습니다. 시리즈를 종료하고 팀을 다시 짜 주세요.'); return; }
  const { deltas, pBlue } = computeDeltas(s.blue, s.red, winner, map);
  const names = Object.fromEntries(ids.map(id => [id, map[id].name]));
  let r = null;
  const ok = await run(async () => { r = await repo.recordGame(s, winner, deltas, pBlue, names, map); });
  if (ok) {
    const wId = (winner === 'blue' ? s.blue : s.red)[0], wName = winner === 'blue' ? '블루' : '레드';
    toast(r.finished
      ? `${wName} 시리즈 승리 ${r.score.blue}:${r.score.red} · 마지막 세트 ${signed(deltas[wId])}`
      : `${wName} 승리 기록됨 · ${r.score.blue}:${r.score.red} · 승리팀 ${signed(deltas[wId])}`);
  }
});

// 결과창 업로드: 이미지 축소 → Worker → 선수 연결 → 경기에 저장
function autoMap(m, players) {
  const map = pmap(), ids = [...m.blue, ...m.red], used = new Set(), out = {};
  const norm = x => String(x || '').toLowerCase().replace(/\s+/g, '').replace(/#.*/, '');
  players.forEach((p, i) => {
    const n = norm(p.name);
    const hit = ids.find(id => !used.has(id) && ((map[id] && (map[id].riotNames || []).some(r => norm(r) === n)) || norm((m.names || {})[id]) === n))
      || ids.find(id => !used.has(id) && n && norm((m.names || {})[id]) && n.includes(norm((m.names || {})[id])));
    if (hit) { used.add(hit); out[i] = hit; }
  });
  return out;
}
async function shrink(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9).split(',')[1];
}
$('shotInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  const u = state.upload; if (!file || !u) return;
  const m = repo.matches.find(x => x.id === u.mid); if (!m) return;
  state.upload = { mid: u.mid, loading: true }; renderHistory();
  try {
    const res = await fetch(VISION_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: await shrink(file), mime: 'image/jpeg' }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.result) throw new Error(data.error || '결과창을 읽지 못했습니다.');
    if (!(data.result.players || []).length) throw new Error('플레이어를 찾지 못했습니다. 결과창 전체가 보이게 다시 찍어 주세요.');
    state.upload = { mid: u.mid, parsed: data.result, map: autoMap(m, data.result.players) };
  } catch (err) {
    state.upload = { mid: u.mid, err: err.message || '결과창을 읽지 못했습니다.' };
  }
  renderHistory();
});
$('history').addEventListener('change', e => {
  const sel = e.target.closest('[data-row]'); if (!sel || !state.upload || !state.upload.map) return;
  const i = +sel.dataset.row;
  // 같은 선수를 두 줄에 연결하지 않도록 이전 연결은 푼다
  for (const k of Object.keys(state.upload.map)) if (state.upload.map[k] === sel.value && +k !== i) delete state.upload.map[k];
  if (sel.value) state.upload.map[i] = sel.value; else delete state.upload.map[i];
  renderHistory();
});
$('history').addEventListener('click', async e => {
  const shot = e.target.closest('[data-shot]');
  if (shot) { state.upload = { mid: shot.dataset.shot }; $('shotInput').click(); return; }
  if (e.target.id === 'btnShotCancel') { state.upload = null; renderHistory(); return; }
  if (e.target.id === 'btnShotSave') {
    const u = state.upload, m = repo.matches.find(x => x.id === u.mid); if (!m) return;
    const stats = {}, pm = pmap();
    Object.entries(u.map).forEach(([i, pid]) => { stats[pid] = u.parsed.players[i]; });
    if (!Object.keys(stats).length) { toast('연결된 선수가 없습니다.'); return; }
    const { duration = '', winner = 'unknown', teams = [], notes = '' } = u.parsed;
    const ok = await run(async () => {
      await repo.updateMatch(m.id, { stats, statsMeta: { duration, winner, teams, notes, ts: Date.now() } });
      for (const [pid, st] of Object.entries(stats)) {
        const p = pm[pid], names = (p && p.riotNames) || [];
        if (p && st.name && !names.includes(st.name)) await repo.updatePlayer(pid, { riotNames: [...names, st.name] });
      }
    });
    if (ok) { state.upload = null; toast(`${Object.keys(stats).length}명의 결과를 저장했습니다.`); renderHistory(); }
    return;
  }
  const t = e.target, d = t.dataset;
  if (t.closest('.trash > summary')) { state.trashOpen = !t.closest('.trash').open; return; }
  if (d.del) { state.confirmDel = d.del; renderHistory(); }
  else if ('delNo' in d) { state.confirmDel = null; renderHistory(); }
  else if (d.delYes) {
    const m = repo.matches.find(x => x.id === d.delYes); if (!m) return;
    let r = null;
    const ok = await run(async () => { r = await repo.trashGame(m, pmap()); });
    state.confirmDel = null;
    if (ok && r.isLatest && m.series) { state.selected = new Set([...m.blue, ...m.red]); saveSel(); }
    renderAll();
    if (ok) toast('휴지통으로 옮기고 MMR을 되돌렸습니다.');
  }
  else if (d.restore) {
    const x = repo.trash.find(y => y.id === d.restore); if (!x) return;
    if (await run(() => repo.restoreGame(x, pmap()))) toast('경기를 복원했습니다.');
  }
  else if (d.purge) { state.confirmPurge = d.purge; renderHistory(); }
  else if ('purgeNo' in d) { state.confirmPurge = null; renderHistory(); }
  else if (d.purgeYes) {
    const ok = await run(() => repo.purgeTrash(d.purgeYes));
    state.confirmPurge = null; renderHistory();
    if (ok) toast('완전히 삭제했습니다.');
  }
});

function tierOptions(sel) { sel.innerHTML = TIERS.map(([n, m]) => `<option value="${m}" ${m === 1000 ? 'selected' : ''}>${n} · ${m}</option>`).join(''); }
tierOptions($('addTier')); tierOptions($('bulkTier'));
const nameTaken = (name, exceptId) => repo.players.some(p => p.id !== exceptId && p.name.toLowerCase() === name.toLowerCase());
const fresh = (name, mmr, pos = []) => ({ name, mmr, pos, games: 0, wins: 0, losses: 0, ts: Date.now() });

function posText(p) { return (p.pos || []).length ? p.pos.map(k => POS_LABEL[k]).join('/') : '포지션 미정'; }
function getPos(el) { return el.dataset.v ? el.dataset.v.split(',') : []; }
function setPos(el, v) {
  el.dataset.v = v.join(',');
  el.querySelectorAll('[data-p]').forEach(b => {
    const i = v.indexOf(b.dataset.p);
    b.setAttribute('aria-pressed', i >= 0); b.dataset.rank = i >= 0 ? i + 1 : '';
  });
}
function posPicker(el) {
  el.innerHTML = POSITIONS.map(([k, l]) => `<button type="button" data-p="${k}" aria-pressed="false">${l}</button>`).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const k = b.dataset.p; let v = getPos(el);
    if (v.includes(k)) v = v.filter(x => x !== k);
    else if (v.length >= 2) { toast('선호 포지션은 2개까지 고를 수 있습니다.'); return; }
    else v.push(k);
    setPos(el, v);
  });
}
posPicker($('addPos')); posPicker($('editPos'));

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('addName').value.trim().slice(0, 20);
  if (!name) { toast('이름을 입력하세요.'); return; }
  if (nameTaken(name)) { toast(`'${name}'은(는) 이미 있습니다.`); return; }
  if (await run(() => repo.addPlayer(fresh(name, +$('addTier').value, getPos($('addPos')))))) {
    $('addName').value = ''; setPos($('addPos'), []); toast(`${name} 추가됨`);
  }
});
$('bulkForm').addEventListener('submit', async e => {
  e.preventDefault();
  const names = parseNames($('bulkNames').value);
  const add = names.filter(n => !nameTaken(n)), skip = names.length - add.length;
  if (!add.length) { toast(names.length ? '모두 이미 등록된 이름입니다.' : '이름을 입력하세요.'); return; }
  const mmr = +$('bulkTier').value;
  if (await run(async () => { for (const n of add) await repo.addPlayer(fresh(n, mmr)); })) {
    $('bulkNames').value = '';
    toast(`${add.length}명 추가됨${skip ? ` · 중복 ${skip}명 제외` : ''}`);
  }
});

function closeEdit() { state.editId = null; state.confirmDelete = false; $('editPanel').hidden = true; }
$('playerList').addEventListener('click', e => {
  const b = e.target.closest('[data-edit]'); if (!b) return;
  const p = pmap()[b.dataset.edit]; if (!p) return;
  state.editId = p.id; state.confirmDelete = false;
  $('editName').value = p.name; $('editMmr').value = p.mmr; setPos($('editPos'), p.pos || []);
  $('editPanel').hidden = false; renderPlayers();
  $('editPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); $('editName').focus();
});
$('btnEditCancel').addEventListener('click', () => { closeEdit(); renderPlayers(); });
$('btnEditSave').addEventListener('click', async () => {
  const id = state.editId, name = $('editName').value.trim().slice(0, 20), mmr = Number($('editMmr').value);
  if (!name) { toast('이름을 입력하세요.'); return; }
  if (nameTaken(name, id)) { toast(`'${name}'은(는) 이미 있습니다.`); return; }
  if (!Number.isInteger(mmr) || mmr < 0 || mmr > 4000) { toast('MMR은 0~4000 사이 정수로 입력하세요.'); return; }
  if (await run(() => repo.updatePlayer(id, { name, mmr, pos: getPos($('editPos')), ts: Date.now() }))) { closeEdit(); toast('저장했습니다.'); renderPlayers(); }
});
$('btnEditDelete').addEventListener('click', async () => {
  if (!state.confirmDelete) { state.confirmDelete = true; renderPlayers(); return; }
  const id = state.editId, name = $('editName').value;
  if (await run(() => repo.deletePlayer(id))) { state.selected.delete(id); saveSel(); closeEdit(); toast(`${name} 삭제됨`); }
});

repo.onChange(renderAll);
route(); renderAll();
repo.init();
</script>
